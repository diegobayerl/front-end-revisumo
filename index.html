      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ritmo-theme');
          var dark =
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>
